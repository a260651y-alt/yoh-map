<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>麗澤大学キャンパスマップ (MapLibre版)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f3f7fb; overflow: hidden; }
  #map { width: 100vw; height: 100vh; z-index: 1; }

  /* ===== 既存：地図モードのサイド動画パネル ===== */
  #videoPanel {
    position: fixed;
    top: 50%;
    right: 20px;
    width: min(560px, 90vw);
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
    display: none;
    z-index: 100;
    transform: translateY(-50%);
    transition: opacity 0.3s ease;
  }
  #statusBox {
    position: fixed;
    left: 12px;
    bottom: 12px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 120;
    backdrop-filter: blur(4px);
  }
  #videoPanel header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
    color: white;
  }
  #videoPanel h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #closeVideo {
    width: 30px; height: 30px;
    border: none; background: rgba(255,255,255,0.2); color: white;
    border-radius: 50%; cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #closeVideo:hover { background: rgba(255,255,255,0.4); }
  .video-container { position: relative; width: 100%; padding-top: 56.25%; }
  #videoFrame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  #connector { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: none; width: 100%; height: 100%; }
  .maplibregl-popup-content { font-size: 13px; padding: 8px 12px; }

  /* ===== 追加：地図コントロール（航空写真・3D） ===== */
  #mapControls {
    position: fixed; top: 12px; left: 12px; z-index: 125;
    display: flex; flex-direction: column; gap: 8px;
  }
  .map-ctrl-group {
    display: flex; background: #fff; border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    border: 1px solid #e2e8f0; overflow: hidden;
  }
  .map-ctrl-group button {
    border: none; background: #fff;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    color: #475569; cursor: pointer; transition: background .2s, color .2s;
  }
  .map-ctrl-group button + button { border-left: 1px solid #e2e8f0; }
  .map-ctrl-group button.active {
    background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%); color: #fff;
  }

  /* ===== 追加①：モード切り替えボタン（マップ ⇄ 動画） ===== */
  #modeToggle {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 130;
    display: flex;
    background: #fff;
    border-radius: 999px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.22);
    border: 1px solid #e2e8f0;
    overflow: hidden;
  }
  #modeToggle button {
    border: none; background: transparent;
    padding: 11px 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #64748b;
    display: flex; align-items: center; gap: 7px;
    transition: background .2s, color .2s;
  }
  #modeToggle button.active {
    background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
    color: #fff;
  }

  /* ===== 追加②：動画モード（ショート風）オーバーレイ ===== */
  #feedOverlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.94);
    z-index: 110;
    display: none;
    align-items: center; justify-content: center;
  }
  .feed-card {
    width: min(390px, 94vw);
    height: min(780px, 90vh);
    background: #0f172a;
    border-radius: 22px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
  }
  .feed-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; color: #fff;
    background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
  }
  .feed-top .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .feed-top .counter { font-size: 12px; opacity: .9; white-space: nowrap; }
  .feed-icon-btn {
    width: 32px; height: 32px; flex: 0 0 auto;
    border: none; background: rgba(255,255,255,0.2); color: #fff;
    border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .feed-icon-btn:hover { background: rgba(255,255,255,0.4); }

  .feed-video { position: relative; width: 100%; flex: 1 1 auto; background: #000; min-height: 0; }
  .feed-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* 動画切り替えボタン（縦並び・右端） */
  .feed-nav {
    position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px;
    z-index: 3;
  }
  .feed-nav button {
    width: 46px; height: 46px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.85); color: #1e293b;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform .15s, background .2s;
  }
  .feed-nav button:hover { background: #fff; transform: scale(1.08); }
  .feed-nav button:disabled { opacity: .35; cursor: default; transform: none; }
  .feed-hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(255,255,255,0.7); font-size: 11px; z-index: 3;
    pointer-events: none;
  }

  /* 動画下の情報欄 */
  .feed-info { padding: 12px 16px 8px; color: #fff; background: #0f172a; }
  .feed-info .title { font-size: 1.05rem; font-weight: 700; margin: 0 0 4px; }
  .feed-info .desc { font-size: 12.5px; color: #cbd5e1; margin: 0 0 6px; line-height: 1.5; max-height: 3em; overflow-y: auto; }
  .feed-info .meta { font-size: 11px; color: #94a3b8; word-break: break-all; }
  .feed-info .actions { display: flex; gap: 8px; margin-top: 10px; }
  .feed-info .actions button {
    flex: 1; border: none; border-radius: 10px;
    padding: 9px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    background: #1e293b; color: #e2e8f0;
    transition: background .2s;
  }
  .feed-info .actions button:hover { background: #334155; }
  .feed-info .actions button.primary { background: #4a90e2; color: #fff; }
  .feed-info .actions button.primary:hover { background: #357abd; }

  /* フッタータブ（動画 / 再生履歴） */
  .feed-tabs { display: flex; border-top: 1px solid #1e293b; }
  .feed-tabs button {
    flex: 1; border: none; background: #0f172a; color: #94a3b8;
    padding: 12px 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .feed-tabs button.active { color: #fff; border-top: 2px solid #4a90e2; margin-top: -1px; }

  /* 再生履歴ビュー */
  .history-view { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; background: #0f172a; }
  .history-view.show { display: flex; }
  .history-view .scroll { overflow-y: auto; padding: 14px; }
  .history-view h3 { color: #fff; font-size: 14px; margin: 0 0 10px; }
  .history-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
  .history-thumb {
    background: #1e293b; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 1px solid #1e293b; transition: border-color .2s;
  }
  .history-thumb:hover { border-color: #4a90e2; }
  .history-thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .history-thumb span { display: block; color: #cbd5e1; font-size: 11px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-empty { color: #64748b; font-size: 13px; padding: 8px 0; }

  /* トースト（コピー通知など） */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(15,23,42,0.95); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="map"></div>
<div id="statusBox">読み込み中...</div>

<!-- 地図コントロール：航空写真切り替え・3D -->
<div id="mapControls">
  <div class="map-ctrl-group">
    <button id="layerMap" class="active">地図</button>
    <button id="layerPhoto">航空写真</button>
  </div>
  <div class="map-ctrl-group">
    <button id="btn3D">3D表示</button>
  </div>
</div>

<!-- 矢印コネクター（地図モード用） -->
<svg id="connector" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c" />
    </marker>
  </defs>
  <line id="connectorLine" x1="0" y1="0" x2="0" y2="0" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)" stroke-linecap="round" stroke-dasharray="5,8" opacity="0.9" />
</svg>

<!-- 地図モード：サイド動画パネル -->
<div id="videoPanel">
  <header>
    <h2 id="videoTitle">動画タイトル</h2>
    <button id="closeVideo" aria-label="閉じる">×</button>
  </header>
  <div class="video-container">
    <iframe id="videoFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<!-- ===== 追加①：モード切り替えボタン ===== -->
<div id="modeToggle">
  <button id="btnMap" class="active">🗺 地図</button>
  <button id="btnFeed">▶ 動画</button>
</div>

<!-- ===== 追加②：動画モード（ショート風） ===== -->
<div id="feedOverlay">
  <div class="feed-card">
    <div class="feed-top">
      <div class="left">
        <button class="feed-icon-btn" id="feedBack" title="地図に戻る">←</button>
        <span class="counter" id="feedCounter">0 / 0</span>
      </div>
      <button class="feed-icon-btn" id="feedShare" title="公式URLをコピー">⤴</button>
    </div>

    <!-- 動画ビュー -->
    <div id="feedMain" style="display:flex; flex-direction:column; flex:1 1 auto; min-height:0;">
      <div class="feed-video">
        <iframe id="feedFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
        <div class="feed-nav">
          <button id="feedPrev" title="前の動画">▲</button>
          <button id="feedNext" title="次の動画">▼</button>
        </div>
        <div class="feed-hint">スクロール・↑↓キーで切り替え</div>
      </div>
      <div class="feed-info">
        <p class="title" id="feedTitle">動画タイトル</p>
        <p class="desc" id="feedDesc"></p>
        <p class="meta" id="feedMeta">日付・座標・youtubeID</p>
        <div class="actions">
          <button class="primary" id="feedShowMap">📍 地図で見る</button>
          <button id="feedOpen">▶ YouTubeで開く</button>
          <button id="feedCopy">🔗 公式URLコピー</button>
        </div>
      </div>
    </div>

    <!-- 再生履歴ビュー -->
    <div class="history-view" id="historyView">
      <div class="scroll">
        <h3>再生履歴</h3>
        <div class="history-grid" id="historyGrid"></div>
        <h3>動画一覧</h3>
        <div class="history-grid" id="allGrid"></div>
      </div>
    </div>

    <!-- フッタータブ -->
    <div class="feed-tabs">
      <button id="tabVideo" class="active">動画</button>
      <button id="tabHistory">再生履歴</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
<script>
  // --- 1. 地図の初期化 (MapLibre仕様) ---
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256, maxzoom: 19,
          attribution: '© OpenStreetMap contributors'
        },
        // 国土地理院 航空写真（日本全国・無料・APIキー不要）
        gsiphoto: {
          type: 'raster',
          tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],
          tileSize: 256, maxzoom: 18,
          attribution: '地理院タイル（航空写真）'
        }
      },
      layers: [
        { id: 'osm',      type: 'raster', source: 'osm',      layout: { visibility: 'visible' } },
        { id: 'gsiphoto', type: 'raster', source: 'gsiphoto', layout: { visibility: 'none' } }
      ]
    },
    center: [139.9554, 35.8332], // [経度(lng), 緯度(lat)]
    zoom: 16, minZoom: 15, maxZoom: 19
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

  // --- 地図コントロール：航空写真切り替え ---
  const layerMap = document.getElementById('layerMap');
  const layerPhoto = document.getElementById('layerPhoto');
  const btn3D = document.getElementById('btn3D');
  const mapControls = document.getElementById('mapControls');

  function setBaseLayer(key) {
    const photo = key === 'photo';
    map.setLayoutProperty('osm', 'visibility', photo ? 'none' : 'visible');
    map.setLayoutProperty('gsiphoto', 'visibility', photo ? 'visible' : 'none');
    layerPhoto.classList.toggle('active', photo);
    layerMap.classList.toggle('active', !photo);
  }
  layerMap.addEventListener('click', () => setBaseLayer('map'));
  layerPhoto.addEventListener('click', () => setBaseLayer('photo'));

  // --- 3D（地図を傾けて立体表示） ---
  let is3D = false;
  function toggle3D() {
    is3D = !is3D;
    map.easeTo({ pitch: is3D ? 60 : 0, bearing: is3D ? -20 : 0, duration: 600 });
    btn3D.classList.toggle('active', is3D);
    btn3D.textContent = is3D ? '2Dに戻す' : '3D表示';
  }
  btn3D.addEventListener('click', toggle3D);

  // --- 2. 画面要素の取得と変数定義 ---
  const panel = document.getElementById("videoPanel");
  const title = document.getElementById("videoTitle");
  const iframe = document.getElementById("videoFrame");
  const closeBtn = document.getElementById("closeVideo");
  const connector = document.getElementById("connector");
  const connectorLine = document.getElementById("connectorLine");
  const mapElement = document.getElementById("map");

  let activeMarker = null;
  let videoData = [];   // {title, lat, lng, youtubeId, marker}
  let watchedIds = [];  // 再生履歴（IDの並び・新しい順）※メモリ内のみ

  const SHEET_ID = '172EjAWId_IgXCqYVE-1OShEyka6SF7xOSbxCSqWrbqM';
  const GID = 0;

  const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: [0, -35] });

  // --- 3. スプレッドシート連携ロジック ---
  function findColumnIndex(cols, names) {
    names = Array.isArray(names) ? names : [names];
    for (let i = 0; i < cols.length; i++) {
      const label = (cols[i].label || '').toString().toLowerCase().trim();
      for (const n of names) if (label === n) return i;
    }
    for (let i = 0; i < cols.length; i++) {
      const label = (cols[i].label || '').toString().toLowerCase();
      for (const n of names) if (label.includes(n)) return i;
    }
    return -1;
  }

  // YouTube IDを正規化（IDそのまま / 通常URL / youtu.be / Shorts いずれにも対応）
  function extractYouTubeId(v) {
    let s = String(v).trim();
    if (!s) return null;
    if (/^[\w-]{11}$/.test(s)) return s;                          // 既に11文字のID
    const m = s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : s;                                          // 取れなければそのまま
  }

  async function loadSheetData() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
    try {
      updateStatus('シートを取得中...');
      const res = await fetch(url);
      const text = await res.text();
      const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
      if (!m) throw new Error('予期しないレスポンス形式');

      const json = JSON.parse(m[1]);
      const cols = json.table.cols || [];
      const rows = json.table.rows || [];

      const idxLat = findColumnIndex(cols, ['lat', 'latitude', '緯度']);
      const idxLon = findColumnIndex(cols, ['lon', 'lng', 'long', 'longitude', '経度']);
      // ※ 'id' 単体はA列(連番ID)と誤マッチするため候補から除外
      const idxYt = findColumnIndex(cols, ['youtubeid', 'youtube id', 'youtube', 'videoid']);
      const idxTitle = findColumnIndex(cols, ['title', 'タイトル']);
      const idxDesc = findColumnIndex(cols, ['description', '概要', '説明']);

      if (idxLat < 0 || idxLon < 0 || idxYt < 0) {
        updateStatus('列が見つかりません: lat/lon/youtubeID を確認してください');
        return;
      }

      videoData = rows.map(r => {
        const c = r.c || [];
        const lat = c[idxLat] && c[idxLat].v != null ? parseFloat(c[idxLat].v) : null;
        const lng = c[idxLon] && c[idxLon].v != null ? parseFloat(c[idxLon].v) : null;
        const youtubeId = idxYt >= 0 && c[idxYt] && c[idxYt].v != null ? extractYouTubeId(c[idxYt].v) : null;
        const t = idxTitle >= 0 && c[idxTitle] && c[idxTitle].v != null ? String(c[idxTitle].v) : (youtubeId || '');
        const desc = idxDesc >= 0 && c[idxDesc] && c[idxDesc].v != null ? String(c[idxDesc].v) : '';
        return { title: t, lat, lng, youtubeId, description: desc };
      }).filter(d => d.lat !== null && d.lng !== null && d.youtubeId);

      if (videoData.length) {
        videoData.forEach(data => createMarkerFromData(data));
        updateStatus(`読み込み完了: ${videoData.length} 件`);
      } else {
        updateStatus('有効なデータなし。デモを表示します');
        useFallbackData();
      }
    } catch (e) {
      console.error('スプレッドシート読み込みエラー', e);
      updateStatus('読み込み失敗。デモを表示します');
      useFallbackData();
    }
    buildAllGrid();
  }

  // --- 4. マーカー作成関数 (MapLibre仕様) ---
  function createMarkerFromData(data) {
    const marker = new maplibregl.Marker({ color: "#4a90e2" })
      .setLngLat([data.lng, data.lat])
      .addTo(map);
    data.marker = marker;

    const markerEl = marker.getElement();
    markerEl.style.cursor = 'pointer';

    markerEl.addEventListener('mouseenter', () => {
      hoverPopup.setLngLat([data.lng, data.lat]).setHTML(`<b>${data.title}</b>`).addTo(map);
    });
    markerEl.addEventListener('mouseleave', () => hoverPopup.remove());

    // クリック：地図モードのサイドパネルを開く
    markerEl.addEventListener('click', () => openSidePanel(data, marker));
  }

  function openSidePanel(data, marker) {
    activeMarker = marker;
    title.textContent = data.title || '動画';
    iframe.src = `https://www.youtube.com/embed/${data.youtubeId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    panel.style.display = "block";
    panel.style.opacity = 0;
    setTimeout(() => panel.style.opacity = 1, 10);
    connector.style.display = "block";
    updateConnector();
    map.panTo([data.lng, data.lat]);
    pushHistory(data.youtubeId);
  }

  function useFallbackData(){
    const fallback = [
      { title: 'さつき (デモ)', lat: 35.83364, lng: 139.95635, youtubeId: 'JjwVpOU_bFo' },
      { title: 'ひいらぎ (デモ)', lat: 35.83430, lng: 139.95535, youtubeId: 'dQw4w9WgXcQ' },
      { title: 'けやき (デモ)', lat: 35.83290, lng: 139.95480, youtubeId: 'M7lc1UVf-VE' }
    ];
    fallback.forEach(d => { videoData.push(d); createMarkerFromData(d); });
  }

  function updateStatus(msg){
    const s = document.getElementById('statusBox');
    if (s) s.textContent = msg;
  }

  // --- 5. UI制御 & コネクター（地図モード） ---
  closeBtn.addEventListener("click", closeVideo);
  function closeVideo() {
    panel.style.opacity = 0;
    setTimeout(() => {
      panel.style.display = "none";
      connector.style.display = "none";
      iframe.src = "";
    }, 300);
    activeMarker = null;
  }

  function updateConnector() {
    if (!activeMarker || panel.style.display === "none") return;
    const pinPoint = map.project(activeMarker.getLngLat());
    const panelRect = panel.getBoundingClientRect();
    const mapRect = mapElement.getBoundingClientRect();
    connectorLine.setAttribute("x1", pinPoint.x);
    connectorLine.setAttribute("y1", pinPoint.y - 15);
    connectorLine.setAttribute("x2", panelRect.left - mapRect.left);
    connectorLine.setAttribute("y2", panelRect.top - mapRect.top + panelRect.height / 2);
  }

  map.on('load', loadSheetData);
  map.on('move', updateConnector);
  window.addEventListener("resize", updateConnector);

  /* ============================================================
     追加機能：モード切り替え（マップ⇄動画）＋ 動画切り替え
     ============================================================ */
  const btnMap = document.getElementById('btnMap');
  const btnFeed = document.getElementById('btnFeed');
  const modeToggle = document.getElementById('modeToggle');
  const feedOverlay = document.getElementById('feedOverlay');
  const feedFrame = document.getElementById('feedFrame');
  const feedTitle = document.getElementById('feedTitle');
  const feedDesc = document.getElementById('feedDesc');
  const feedMeta = document.getElementById('feedMeta');
  const feedCounter = document.getElementById('feedCounter');
  const feedPrev = document.getElementById('feedPrev');
  const feedNext = document.getElementById('feedNext');
  const feedBack = document.getElementById('feedBack');
  const feedShare = document.getElementById('feedShare');
  const feedCopy = document.getElementById('feedCopy');
  const feedOpen = document.getElementById('feedOpen');
  const feedShowMap = document.getElementById('feedShowMap');
  const tabVideo = document.getElementById('tabVideo');
  const tabHistory = document.getElementById('tabHistory');
  const feedMain = document.getElementById('feedMain');
  const historyView = document.getElementById('historyView');
  const historyGrid = document.getElementById('historyGrid');
  const allGrid = document.getElementById('allGrid');

  let feedIndex = 0;

  // --- モード切り替え ---
  function setMode(mode) {
    if (mode === 'feed') {
      if (!videoData.length) { showToast('動画データがまだありません'); return; }
      btnFeed.classList.add('active');
      btnMap.classList.remove('active');
      feedOverlay.style.display = 'flex';
      modeToggle.style.display = 'none';   // 重なり防止：フィードのタブと被らないよう隠す
      mapControls.style.display = 'none';
      closeVideo();              // 地図用パネルは閉じる
      showFeed(feedIndex);       // 現在位置の動画を表示
    } else {
      btnMap.classList.add('active');
      btnFeed.classList.remove('active');
      feedOverlay.style.display = 'none';
      modeToggle.style.display = 'flex';
      mapControls.style.display = 'flex';
      feedFrame.src = '';        // 再生停止
      showVideoTab();            // タブを動画側に戻しておく
    }
  }
  btnMap.addEventListener('click', () => setMode('map'));
  btnFeed.addEventListener('click', () => setMode('feed'));
  feedBack.addEventListener('click', () => setMode('map'));

  // --- 動画の表示 ---
  function showFeed(i) {
    if (!videoData.length) return;
    feedIndex = (i + videoData.length) % videoData.length; // 端でループ
    const d = videoData[feedIndex];
    feedFrame.src = `https://www.youtube.com/embed/${d.youtubeId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    feedTitle.textContent = d.title || '動画';
    feedDesc.textContent = d.description || '';
    feedMeta.textContent = `座標: ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)} ／ youtubeID: ${d.youtubeId}`;
    feedCounter.textContent = `${feedIndex + 1} / ${videoData.length}`;
    showVideoTab();
    pushHistory(d.youtubeId);
  }

  // --- 動画切り替えボタン ---
  function nextVideo() { showFeed(feedIndex + 1); }
  function prevVideo() { showFeed(feedIndex - 1); }
  feedNext.addEventListener('click', nextVideo);
  feedPrev.addEventListener('click', prevVideo);

  // スクロール（ホイール）で切り替え
  let wheelLock = false;
  feedOverlay.addEventListener('wheel', (e) => {
    if (feedOverlay.style.display === 'none') return;
    if (historyView.classList.contains('show')) return; // 履歴表示中はスクロール無効化
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    if (e.deltaY > 0) nextVideo(); else prevVideo();
    setTimeout(() => wheelLock = false, 600);
  }, { passive: false });

  // 矢印キーで切り替え / Escで閉じる
  window.addEventListener('keydown', (e) => {
    if (feedOverlay.style.display === 'none') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); nextVideo(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); prevVideo(); }
    else if (e.key === 'Escape') setMode('map');
  });

  // --- 「地図で見る」：その動画の場所へ移動して地図モードへ ---
  feedShowMap.addEventListener('click', () => {
    const d = videoData[feedIndex];
    setMode('map');
    if (d.marker) openSidePanel(d, d.marker);
    map.flyTo({ center: [d.lng, d.lat], zoom: 18 });
  });

  // --- 共有（公式URLコピー） ---
  function copyUrl() {
    const d = videoData[feedIndex];
    const url = `https://www.youtube.com/watch?v=${d.youtubeId}`;
    navigator.clipboard?.writeText(url)
      .then(() => showToast('公式URLをコピーしました'))
      .catch(() => showToast(url));
  }
  feedShare.addEventListener('click', copyUrl);
  feedCopy.addEventListener('click', copyUrl);

  // --- YouTubeで開く（埋め込み再生できない動画用のフォールバック） ---
  feedOpen.addEventListener('click', () => {
    const d = videoData[feedIndex];
    window.open(`https://www.youtube.com/watch?v=${d.youtubeId}`, '_blank');
  });

  // --- タブ：動画 / 再生履歴 ---
  function showVideoTab() {
    tabVideo.classList.add('active');
    tabHistory.classList.remove('active');
    feedMain.style.display = 'flex';
    historyView.classList.remove('show');
  }
  function showHistoryTab() {
    tabHistory.classList.add('active');
    tabVideo.classList.remove('active');
    feedMain.style.display = 'none';
    historyView.classList.add('show');
    buildHistoryGrid();
  }
  tabVideo.addEventListener('click', showVideoTab);
  tabHistory.addEventListener('click', showHistoryTab);

  // --- 再生履歴の管理（メモリ内） ---
  function pushHistory(id) {
    watchedIds = watchedIds.filter(x => x !== id); // 重複除去
    watchedIds.unshift(id);                        // 先頭に追加
    if (watchedIds.length > 30) watchedIds.pop();
  }

  function thumbHtml(d) {
    return `<div class="history-thumb" data-id="${d.youtubeId}">
      <img src="https://img.youtube.com/vi/${d.youtubeId}/mqdefault.jpg" alt="" loading="lazy">
      <span>${d.title || d.youtubeId}</span>
    </div>`;
  }

  function buildHistoryGrid() {
    const items = watchedIds
      .map(id => videoData.find(d => d.youtubeId === id))
      .filter(Boolean);
    historyGrid.innerHTML = items.length
      ? items.map(thumbHtml).join('')
      : '<p class="history-empty">まだ再生した動画はありません</p>';
    bindThumbClicks(historyGrid);
  }

  function buildAllGrid() {
    allGrid.innerHTML = videoData.map(thumbHtml).join('');
    bindThumbClicks(allGrid);
  }

  function bindThumbClicks(container) {
    container.querySelectorAll('.history-thumb').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-id');
        const i = videoData.findIndex(d => d.youtubeId === id);
        if (i >= 0) showFeed(i);
      });
    });
  }

  // --- トースト通知 ---
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // デバッグ用
  window.reloadSheet = loadSheetData;
</script>
</body>
</html>
