<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>yoh-map | 麗澤大学キャンパスマップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfaf7;
    --surface: #ffffff;
    --ink: #22302a;
    --muted: #75817b;
    --line: #e8e6df;
    --green: #0e8a4f;
    --green-deep: #0a6b3d;
    --green-soft: #e7f4ec;
    --shadow-s: 0 1px 4px rgba(34,48,42,.10);
    --shadow-m: 0 4px 18px rgba(34,48,42,.14);
    --shadow-l: 0 12px 40px rgba(34,48,42,.22);
    --round: "M PLUS Rounded 1c", sans-serif;
    --jp: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--jp); color: var(--ink); background: var(--paper); overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  #map { position: fixed; inset: 0; z-index: 1; }
  .ic { width: 1.4em; height: 1.4em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  /* ============ ローディング ============ */
  #splash {
    position: fixed; inset: 0; z-index: 500; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: opacity .6s ease, visibility .6s;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #splash .logo { font-family: var(--round); font-weight: 800; font-size: clamp(2.4rem, 9vw, 3.4rem); color: var(--ink); }
  #splash .logo em { font-style: normal; color: var(--green); }
  #splash .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  #splash .loader { margin-top: 20px; width: 132px; height: 4px; border-radius: 4px; background: #ece9e1; overflow: hidden; position: relative; }
  #splash .loader::after { content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%; border-radius: 4px; background: var(--green); animation: slide 1.1s infinite; }
  @keyframes slide { to { left: 100%; } }
  #splashStatus { font-size: 12px; color: var(--muted); min-height: 1.2em; }

  /* ============ 上部フローティングUI ============ */
  #topBar {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
    z-index: 125; display: flex; align-items: flex-start; gap: 8px; pointer-events: none;
  }
  #topBar > * { pointer-events: auto; }
  #brandChip {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface); border-radius: 999px; box-shadow: var(--shadow-m);
    padding: 10px 16px; font-family: var(--round); font-weight: 800; font-size: 15.5px;
  }
  #brandChip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  #brandChip em { font-style: normal; color: var(--green); }
  #topBar .spacer { flex: 1; }
  #topRight { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

  .seg { display: flex; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow-m); padding: 4px; }
  .seg button {
    border: none; background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: var(--muted);
    cursor: pointer; transition: background .18s, color .18s; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .seg button.active { background: var(--green-soft); color: var(--green-deep); }
  .seg button:hover:not(.active) { color: var(--ink); }

  .fab {
    display: flex; align-items: center; gap: 6px; background: var(--surface); border: none; border-radius: 999px; box-shadow: var(--shadow-m);
    padding: 10px 15px; font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; transition: color .18s, background .18s;
  }
  .fab:hover { color: var(--green-deep); }
  .fab.active { background: var(--green); color: #fff; }

  /* ============ モード切り替え（下中央・常設） ============ */
  #modeToggle { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 320; }
  #modeToggle button { padding: 11px 26px; font-size: 13.5px; }
  #modeToggle button.active { background: var(--green); color: #fff; }

  #statusBox {
    position: fixed; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--surface); box-shadow: var(--shadow-s); color: var(--muted); padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 500; z-index: 118; transition: opacity .4s; white-space: nowrap;
  }
  #statusBox.fade { opacity: 0; pointer-events: none; }

  .maplibregl-popup-content { font-family: var(--round); font-weight: 800; font-size: 12.5px; color: var(--ink); padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow-m); }
  .maplibregl-popup-tip { display: none; }

  /* ============ 地図モード：ミニプレイヤー ============ */
  #miniPlayer {
    position: fixed; top: 50%; right: 20px; transform: translateY(-50%); width: min(480px, 92vw);
    background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-l); overflow: hidden; display: none; z-index: 200;
  }
  #miniPlayer.show { display: block; }
  #miniHeader { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; }
  #miniHeader:active { cursor: grabbing; }
  #miniHeader .grip { color: #c9cec9; display: flex; }
  #miniTitle { margin: 0; flex: 1; font-family: var(--round); font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round-btn {
    width: 38px; height: 38px; flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 50%;
    cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: color .18s, border-color .18s, background .18s;
  }
  .round-btn:hover { color: var(--green-deep); border-color: var(--green); }
  .mini-video { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  #miniFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #miniDesc { margin: 0; padding: 10px 16px; font-size: 12.5px; color: #4a544f; line-height: 1.65; max-height: 5em; overflow-y: auto; }
  #miniDesc:empty { display: none; }
  .mini-foot { display: flex; gap: 8px; padding: 0 14px 14px; }
  .chip-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 9px 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .18s, color .18s, border-color .18s; flex: 1;
  }
  .chip-btn:hover { border-color: var(--green); color: var(--green-deep); }
  .chip-btn.primary { background: var(--green); border-color: var(--green); color: #fff; }

  /* ============ ✨動画モード（全画面ショート風UI） ============ */
  #videoMode {
    position: fixed; inset: 0; z-index: 250; background: #000;
    display: none; justify-content: center; align-items: center;
  }
  #videoMode.show { display: flex; }
  
  /* 縦長コンテナ（TikTok/Shorts風） */
  .short-container {
    position: relative; width: 100%; height: 100%; max-width: 500px; background: #000;
    display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 520px) {
    .short-container { height: calc(100vh - 40px); border-radius: 16px; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
  }

  /* 動画表示エリア */
  .short-video-wrap { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  #vmFrame { width: 100%; height: 100%; border: 0; pointer-events: auto; }

  /* 上部ヘッダー（yoh-mapロゴとカウンター） */
  .short-top-bar {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 16px; right: 16px;
    z-index: 10; display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .short-top-bar .brand { font-family: var(--round); font-weight: 800; font-size: 18px; color: #fff; }
  .short-top-bar .brand em { font-style: normal; color: #26da7e; }
  #vmCounter { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 700; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 999px; }

  /* 右側：縦並びアクションボタン */
  .short-right-actions {
    position: absolute; right: 12px; bottom: calc(100px + env(safe-area-inset-bottom));
    z-index: 10; display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  .action-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; cursor: pointer; background: none; border: none; padding: 0; }
  .action-item .circle-btn {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2); color: #fff;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);
    transition: transform 0.15s, background 0.15s;
  }
  .action-item:hover .circle-btn { transform: scale(1.08); background: rgba(14, 138, 79, 0.8); border-color: #26da7e; }
  .action-item span { font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  /* 左下：タイトルと説明文（グラデーション被せ） */
  .short-bottom-info {
    position: absolute; left: 0; right: 70px; bottom: 0;
    padding: 40px 16px calc(90px + env(safe-area-inset-bottom));
    z-index: 9; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    color: #fff; pointer-events: none;
  }
  .short-info-inner { pointer-events: auto; max-height: 160px; overflow-y: auto; scrollbar-width: none; }
  .short-info-inner::-webkit-scrollbar { display: none; }
  #vmTitle { margin: 0 0 6px 0; font-family: var(--round); font-weight: 800; font-size: 15.5px; line-height: 1.4; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  #vmDesc { margin: 0; font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,0.85); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  #vmDesc.open { -webkit-line-clamp: unset; }

  /* 上下切り替え用ミニ矢印（PCなどで視覚的なガイド） */
  .short-nav-arrows {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; gap: 8px;
  }
  .short-nav-arrows .round-btn { background: rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.2); color: #fff; }
  .short-nav-arrows .round-btn:hover { background: var(--green); }

  /* トースト */
  #toast {
    position: fixed; bottom: calc(85px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(12px);
    background: #fff; color: var(--ink); padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 700;
    z-index: 600; box-shadow: var(--shadow-l); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    #topBar { flex-wrap: wrap; }
    .seg button { padding: 7px 10px; font-size: 11.5px; }
    #miniPlayer { top: auto; bottom: calc(76px + env(safe-area-inset-bottom)); right: 50%; transform: translateX(50%); }
    .short-nav-arrows { display: none; } /* スマホでは上下ナビボタンを隠してスワイプ特化に */
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- ローディング -->
<div id="splash">
  <div class="logo">yoh<em>-</em>map</div>
  <div class="sub">麗澤大学キャンパスマップ</div>
  <div class="loader"></div>
  <div id="splashStatus">読み込み中...</div>
</div>

<!-- 上部UI（地図モード時のみ表示） -->
<div id="topBar">
  <div id="brandChip"><span class="dot"></span>yoh<em>-</em>map</div>
  <span class="spacer"></span>
  <div id="topRight">
    <div class="seg">
      <button id="layerMap">地図</button>
      <button id="layerSat" class="active">衛星</button>
      <button id="layerPhoto">航空写真</button>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="fab" id="btn3D">
        <svg class="ic" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="m3 9v6l9 5 9-5V9"/></svg>
        3D
      </button>
      <button class="fab" id="btnHome">
        <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="14.5" cy="14.5" r="2"/></svg>
        全体
      </button>
    </div>
  </div>
</div>

<div id="statusBox">読み込み中...</div>

<!-- 地図モード：ミニプレイヤー -->
<div id="miniPlayer">
  <div id="miniHeader">
    <span class="grip">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="7" r="1.2"/><circle cx="15" cy="7" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="17" r="1.2"/><circle cx="15" cy="17" r="1.2"/></svg>
    </span>
    <h2 id="miniTitle">動画タイトル</h2>
    <button class="round-btn" id="miniClose" title="閉じる">
      <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="mini-video">
    <iframe id="miniFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
  <p id="miniDesc"></p>
  <div class="mini-foot">
    <button class="chip-btn primary" id="miniToVideo">
      <svg class="ic" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z"/></svg>
      動画モードで見る
    </button>
    <button class="chip-btn" id="miniShare">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4m0 0L8 8m4-4 4 4"/></svg>
      共有
    </button>
  </div>
</div>

<!-- ✨ 新・動画モード（全画面ショート動画風UI） -->
<div id="videoMode">
  <div class="short-container">
    
    <!-- 背面：動画プレイヤー -->
    <div class="short-video-wrap">
      <iframe id="vmFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>

    <!-- 前面レイヤー：ヘッダー -->
    <div class="short-top-bar">
      <span class="brand">yoh<em>-</em>map</span>
      <span id="vmCounter">1 / --</span>
    </div>

    <!-- 前面レイヤー：左下テキスト -->
    <div class="short-bottom-info">
      <div class="short-info-inner">
        <h1 id="vmTitle">動画タイトル</h1>
        <p id="vmDesc" title="タップで全表示"></p>
      </div>
    </div>

    <!-- 前面レイヤー：右側アクション縦並び -->
    <div class="short-right-actions">
      <button class="action-item" id="vmMapBtn">
        <div class="circle-btn">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10Z"/><circle cx="12" cy="11" r="2.2"/></svg>
        </div>
        <span>位置</span>
      </button>
      
      <button class="action-item" id="vmShare">
        <div class="circle-btn">
          <svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4m0 0L8 8m4-4 4 4"/></svg>
        </div>
        <span>共有</span>
      </button>

      <button class="action-item" id="vmOpen">
        <div class="circle-btn">
          <svg class="ic" viewBox="0 0 24 24"><path d="m10 8 6 4-6 4V8Z"/><rect x="3" y="5" width="18" height="14" rx="3"/></svg>
        </div>
        <span>アプリ</span>
      </button>
    </div>

    <!-- PC向け：右側中央に配置される上下移動ボタン -->
    <div class="short-nav-arrows">
      <button class="round-btn" id="vmPrev" title="前の動画">
        <svg class="ic" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></svg>
      </button>
      <button class="round-btn" id="vmNext" title="次の動画">
        <svg class="ic" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg>
      </button>
    </div>

  </div>
</div>

<!-- モード切り替え（最前面・常設） -->
<div id="modeToggle" class="seg">
  <button id="btnMapMode" class="active">
    <svg class="ic" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
    地図
  </button>
  <button id="btnVideoMode">
    <svg class="ic" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z"/></svg>
    動画
  </button>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
<script>
  /* ============ 1. 地図 ============ */
  const CAMPUS = [139.9554, 35.8332];
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: { type: 'raster', tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19, attribution: '© OpenStreetMap contributors' },
        esri: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 19, attribution: 'Tiles © Esri' },
        gsiphoto: { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'], tileSize: 256, maxzoom: 18, attribution: '地理院タイル' }
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm', layout: { visibility: 'none' } },
        { id: 'esri', type: 'raster', source: 'esri', layout: { visibility: 'visible' } },
        { id: 'gsiphoto', type: 'raster', source: 'gsiphoto', layout: { visibility: 'none' } }
      ]
    },
    center: CAMPUS, zoom: 14, minZoom: 2, maxZoom: 19
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  /* ============ 2. 状態 ============ */
  const $ = id => document.getElementById(id);
  const splash = $('splash');
  let videoData = [];
  let markersBounds = null;
  let currentIndex = 0;

  const SHEET_ID = '172EjAWId_IgXCqYVE-1OShEyka6SF7xOSbxCSqWrbqM';
  const GID = 0;
  const FIT_PADDING = { top: 120, left: 60, right: 60, bottom: 90 };
  const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: [0, -38] });

  /* ============ 3. データ読み込み (高耐久クレンジング) ============ */
  function findColumnIndex(cols, names) {
    for (let i = 0; i < cols.length; i++) {
      const label = (cols[i].label || '').toString().toLowerCase().trim();
      for (const n of names) if (label === n) return i;
    }
    for (let i = 0; i < cols.length; i++) {
      const label = (cols[i].label || '').toString().toLowerCase();
      for (const n of names) if (label.includes(n)) return i;
    }
    return -1;
  }
  function extractYouTubeId(v) {
    let s = String(v).trim();
    if (!s) return null;
    if (/^[\w-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : s;
  }

  async function loadSheetData() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
    try {
      setStatus('データを取得中...');
      const res = await fetch(url);
      const text = await res.text();
      const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
      if (!m) throw new Error('Format error');
      const json = JSON.parse(m[1]);
      const cols = json.table.cols || [];
      const rows = json.table.rows || [];

      const idxLat = findColumnIndex(cols, ['lat', 'latitude', '緯度']);
      const idxLon = findColumnIndex(cols, ['lon', 'lng', 'long', 'longitude', '経度']);
      const idxYt = findColumnIndex(cols, ['youtubeid', 'youtube id', 'youtube', 'videoid']);
      const idxTitle = findColumnIndex(cols, ['title', 'タイトル']);
      const idxDesc = findColumnIndex(cols, ['description', '概要', '説明']);

      if (idxLat < 0 || idxLon < 0) {
        useFallbackData();
      } else {
        videoData = rows.map((r, rowIdx) => {
          const c = r.c || [];
          let latVal = idxLat >= 0 && c[idxLat] && c[idxLat].v != null ? String(c[idxLat].v) : '';
          let lngVal = idxLon >= 0 && c[idxLon] && c[idxLon].v != null ? String(c[idxLon].v) : '';
          
          const latMatch = latVal.match(/\d+\.\d+/);
          const lngMatch = lngVal.match(/\d+\.\d+/);
          const lat = latMatch ? parseFloat(latMatch[0]) : null;
          let lng = lngMatch ? parseFloat(lngMatch[0]) : null;

          if (lat && lng && Math.abs(lat - lng) < 0.1) lng = 139.95635; 

          let youtubeId = idxYt >= 0 && c[idxYt] && c[idxYt].v != null ? extractYouTubeId(c[idxYt].v) : null;
          if (!youtubeId || youtubeId.length !== 11) {
            for (let cell of c) {
              if (cell && cell.v) {
                const cellStr = String(cell.v).trim();
                if (/^[a-zA-Z0-9_-]{11}$/.test(cellStr) && !cellStr.includes('.')) { youtubeId = cellStr; break; }
              }
            }
          }

          let t = idxTitle >= 0 && c[idxTitle] && c[idxTitle].v != null ? String(c[idxTitle].v) : '';
          if (!t && lngVal.includes('】')) t = lngVal.substring(lngVal.indexOf(' ') + 1);
          if (!t) t = youtubeId ? `スポット (ID: ${youtubeId})` : `スポット ${rowIdx + 1}`;

          const desc = idxDesc >= 0 && c[idxDesc] && c[idxDesc].v != null ? String(c[idxDesc].v) : '';
          return { title: t, lat, lng, youtubeId, description: desc };
        }).filter(d => d.lat !== null && d.lng !== null && d.youtubeId);

        if (videoData.length) setStatus(`${videoData.length} 件のスポット`);
        else useFallbackData();
      }
    } catch (e) {
      useFallbackData();
    }
    videoData.forEach((d, i) => createPin(d, i));
    computeBounds();
    playIntro();
  }

  function useFallbackData(){
    videoData = [
      { title: 'さつき (デモ)', lat: 35.83364, lng: 139.95635, youtubeId: 'JjwVpOU_bFo', description: 'デモ動画1用の説明文文面です。' },
      { title: 'ひいらぎ (デモ)', lat: 35.83430, lng: 139.95535, youtubeId: 'dQw4w9WgXcQ', description: 'リックロールのデモ動画です。' }
    ];
  }
  function computeBounds() {
    if (!videoData.length) return;
    markersBounds = new maplibregl.LngLatBounds();
    videoData.forEach(d => markersBounds.extend([d.lng, d.lat]));
  }

  /* ============ 4. イントロ・基本操作 ============ */
  function playIntro() {
    setTimeout(() => splash.classList.add('hide'), 400);
    setTimeout(() => {
      if (markersBounds) map.fitBounds(markersBounds, { padding: FIT_PADDING, maxZoom: 17, duration: 3400, curve: 1.55, essential: true });
    }, 900);
    setTimeout(() => $('statusBox').classList.add('fade'), 5200);
  }
  $('btnHome').addEventListener('click', () => { if (markersBounds) map.fitBounds(markersBounds, { padding: FIT_PADDING, maxZoom: 17, duration: 1100 }); });

  function createPin(d, i) {
    const marker = new maplibregl.Marker({ color: '#0e8a4f' }).setLngLat([d.lng, d.lat]).addTo(map);
    d.marker = marker; const el = marker.getElement(); el.style.cursor = 'pointer';
    el.addEventListener('mouseenter', () => hoverPopup.setLngLat([d.lng, d.lat]).setHTML(d.title).addTo(map));
    el.addEventListener('mouseleave', () => hoverPopup.remove());
    el.addEventListener('click', (e) => { e.stopPropagation(); openMini(i); });
  }

  /* ============ 5. レイヤー ============ */
  const BASE = ['osm', 'esri', 'gsiphoto'];
  function setBaseLayer(key) {
    const target = key === 'osm' ? 'osm' : key === 'sat' ? 'esri' : 'gsiphoto';
    BASE.forEach(id => map.setLayoutProperty(id, 'visibility', id === target ? 'visible' : 'none'));
    $('layerMap').classList.toggle('active', key === 'osm');
    $('layerSat').classList.toggle('active', key === 'sat');
    $('layerPhoto').classList.toggle('active', key === 'photo');
  }
  $('layerMap').addEventListener('click', () => setBaseLayer('osm'));
  $('layerSat').addEventListener('click', () => setBaseLayer('sat'));
  $('layerPhoto').addEventListener('click', () => setBaseLayer('photo'));

  let is3D = false;
  $('btn3D').addEventListener('click', () => { is3D = !is3D; map.easeTo({ pitch: is3D ? 60 : 0, bearing: is3D ? -20 : 0, duration: 600 }); $('btn3D').classList.toggle('active', is3D); });

  /* ============ 6. ミニプレイヤー ============ */
  const mini = $('miniPlayer'), miniFrame = $('miniFrame');
  function openMini(i) {
    currentIndex = i; const d = videoData[i];
    $('miniTitle').textContent = d.title; $('miniDesc').textContent = d.description;
    miniFrame.src = `https://www.youtube.com/embed/${d.youtubeId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    mini.classList.add('show'); map.panTo([d.lng, d.lat]);
  }
  function closeMini() { mini.classList.remove('show'); miniFrame.src = ''; }
  $('miniClose').addEventListener('click', closeMini);
  $('miniToVideo').addEventListener('click', () => { closeMini(); setMode('video'); });
  $('miniShare').addEventListener('click', () => shareVideo(currentIndex));

  // ミニプレイヤーのドラッグ
  let drag = null;
  $('miniHeader').addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return; const r = mini.getBoundingClientRect();
    mini.style.left = r.left + 'px'; mini.style.top = r.top + 'px'; mini.style.right = 'auto'; mini.style.bottom = 'auto'; mini.style.transform = 'none';
    drag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top }; $('miniHeader').setPointerCapture(e.pointerId);
  });
  $('miniHeader').addEventListener('pointermove', (e) => {
    if (!drag) return; let nl = drag.left + (e.clientX - drag.x), nt = drag.top + (e.clientY - drag.y);
    mini.style.left = Math.max(8 - mini.offsetWidth*0.6, Math.min(window.innerWidth - mini.offsetWidth*0.4, nl)) + 'px';
    mini.style.top = Math.max(8, Math.min(window.innerHeight - 60, nt)) + 'px';
  });
  $('miniHeader').addEventListener('pointerup', () => drag = null);

  /* ============ 7. モード切り替え ============ */
  function setMode(mode) {
    const video = mode === 'video';
    if (video && !videoData.length) { showToast('動画データがありません'); return; }
    $('btnVideoMode').classList.toggle('active', video);
    $('btnMapMode').classList.toggle('active', !video);
    $('videoMode').classList.toggle('show', video);
    $('topBar').style.display = video ? 'none' : 'flex';
    if (video) { closeMini(); showVm(currentIndex); } else { $('vmFrame').src = ''; }
  }
  $('btnMapMode').addEventListener('click', () => setMode('map'));
  $('btnVideoMode').addEventListener('click', () => setMode('video'));

  /* ============ 8. ✨ ショート動画モード処理 ============ */
  const vmFrame = $('vmFrame'), vmTitle = $('vmTitle'), vmDesc = $('vmDesc'), vmCounter = $('vmCounter');

  function showVm(i) {
    currentIndex = ((i % videoData.length) + videoData.length) % videoData.length;
    const d = videoData[currentIndex];
    
    // ショート動画風にするため、YouTubeのパラメータにcontrols=0(コントロール非表示)を付与可能ですが、
    // 再生・一時停止の利便性を残すため、標準プレイヤーを全画面フィットさせています。
    vmFrame.src = `https://www.youtube.com/embed/${d.youtubeId}?autoplay=1&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3`;
    
    vmTitle.textContent = d.title;
    vmDesc.textContent = d.description || '説明はありません。';
    vmDesc.classList.remove('open');
    vmCounter.textContent = `${currentIndex + 1} / ${videoData.length}`;
  }

  const nextVideo = () => showVm(currentIndex + 1);
  const prevVideo = () => showVm(currentIndex - 1);
  $('vmNext').addEventListener('click', nextVideo);
  $('vmPrev').addEventListener('click', prevVideo);
  vmDesc.addEventListener('click', () => vmDesc.classList.toggle('open'));

  // アクション：地図へ戻る
  $('vmMapBtn').addEventListener('click', () => {
    const d = videoData[currentIndex];
    setMode('map');
    map.flyTo({ center: [d.lng, d.lat], zoom: 18, duration: 1200 });
    setTimeout(() => openMini(currentIndex), 1200);
  });
  $('vmShare').addEventListener('click', () => shareVideo(currentIndex));
  $('vmOpen').addEventListener('click', () => {
    window.open(`https://www.youtube.com/watch?v=${videoData[currentIndex].youtubeId}`, '_blank');
  });

  // ショート動画ならではのジェスチャー（スクロールホイール & 上下スワイプ）
  let wheelLock = false;
  $('videoMode').addEventListener('wheel', (e) => {
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    e.deltaY > 0 ? nextVideo() : prevVideo();
    setTimeout(() => wheelLock = false, 500);
  }, { passive: false });

  let touchY = null;
  $('videoMode').addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
  $('videoMode').addEventListener('touchend', e => {
    if (touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY;
    touchY = null;
    if (Math.abs(dy) < 60) return; // スワイプのしきい値
    dy < 0 ? nextVideo() : prevVideo(); // 上スワイプで次、下スワイプで前
  }, { passive: true });

  window.addEventListener('keydown', (e) => {
    if (!$('videoMode').classList.contains('show')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); nextVideo(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); prevVideo(); }
    else if (e.key === 'Escape') setMode('map');
  });

  /* ============ 9. 共通ファンクション ============ */
  function shareVideo(i) {
    const d = videoData[i]; const url = `https://www.youtube.com/watch?v=${d.youtubeId}`;
    if (navigator.share) navigator.share({ title: d.title, url }).catch(() => {});
    else navigator.clipboard?.writeText(url).then(() => showToast('リンクをコピーしました'));
  }
  function setStatus(msg) { $('statusBox').textContent = msg; $('splashStatus').textContent = msg; }
  let toastTimer = null;
  function showToast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  map.on('load', loadSheetData);
</script>
</body>
