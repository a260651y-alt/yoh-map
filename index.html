<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>yoh-map | 麗澤大学キャンパスマップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0e8a4f; --green-deep: #0a6b3d; --green-soft: #e7f4ec;
    --ink: #22302a; --muted: #75817b; --line: #e8e6df; --surface: #fff;
    --shadow: 0 4px 18px rgba(34,48,42,.16);
    --shadow-l: 0 12px 40px rgba(34,48,42,.24);
    --round: "M PLUS Rounded 1c", sans-serif;
    --jp: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--jp); color: var(--ink); background: #f7f6f2; overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  #map { position: fixed; inset: 0; z-index: 1; }
  .ic { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  /* ===== 地図モードのUI ===== */
  #topBar { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 120; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  #topBar > * { pointer-events: auto; }
  #brand { display: flex; align-items: center; gap: 7px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); padding: 10px 16px; font-family: var(--round); font-weight: 800; font-size: 15px; }
  #brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  #brand em { font-style: normal; color: var(--green); }
  #topRight { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .seg { display: flex; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); padding: 4px; }
  .seg button { border: none; background: transparent; border-radius: 999px; padding: 8px 15px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background .18s, color .18s; }
  .seg button.active { background: var(--green-soft); color: var(--green-deep); }
  .fab { display: flex; align-items: center; gap: 6px; background: var(--surface); border: none; border-radius: 999px; box-shadow: var(--shadow); padding: 10px 15px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .18s, color .18s; }
  .fab.active { background: var(--green); color: #fff; }
  #status { position: fixed; top: calc(116px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--surface); box-shadow: var(--shadow); color: var(--muted); padding: 7px 14px; border-radius: 999px; font-size: 12px; z-index: 118; transition: opacity .4s; white-space: nowrap; }
  #status.fade { opacity: 0; pointer-events: none; }

  /* ===== スポット一覧（地図モード） ===== */
  #searchWrap { position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 24px)); z-index: 130; }
  body.vmode #searchWrap { display: none; }
  #listBtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); border: none; border-radius: 999px; box-shadow: var(--shadow); padding: 12px 16px; font-family: var(--round); font-weight: 800; font-size: 14px; color: var(--ink); cursor: pointer; }
  #listBtn .ic { width: 18px; height: 18px; color: var(--green); }
  #listBtn .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; }
  #listBtn.open .chev { transform: rotate(180deg); }
  #searchResults { margin-top: 8px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-l); overflow: hidden; display: none; }
  #searchResults.show { display: block; }
  .sr-scroll { max-height: 56vh; overflow-y: auto; }
  .sr-group-label { padding: 10px 16px 4px; font-family: var(--round); font-weight: 800; font-size: 11.5px; color: var(--muted); letter-spacing: .04em; background: #f7f9f7; }
  .sr-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background .15s; }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--green-soft); }
  .sr-thumb { width: 52px; height: 36px; border-radius: 8px; background: #ddd center/cover no-repeat; flex: 0 0 auto; }
  .sr-text { flex: 1; min-width: 0; }
  .sr-title { font-family: var(--round); font-weight: 800; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-place { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-go { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 6px 12px; font-family: var(--round); font-weight: 800; font-size: 12px; cursor: pointer; }
  .sr-go .ic { width: 13px; height: 13px; }

  /* ===== グループ表示切替（検索バーの下） ===== */
  #groupBar { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
  body.vmode #groupBar { display: none; }
  .group-chip { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); padding: 7px 14px; font-family: var(--round); font-weight: 800; font-size: 12.5px; color: var(--ink); cursor: pointer; transition: all .15s; user-select: none; }
  .group-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .group-chip[data-g="campus"] .dot { background: var(--green); }
  .group-chip[data-g="member"] .dot { background: #e8892b; }
  .group-chip.off { background: #f0f2f0; color: #aab2ad; border-color: transparent; }
  .group-chip.off .dot { opacity: .3; }

  /* ===== 現在地ボタン ===== */
  #locBtn { position: fixed; right: 14px; bottom: calc(150px + env(safe-area-inset-bottom)); width: 46px; height: 46px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-l); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 120; color: var(--green); transition: transform .1s; }
  #locBtn:active { transform: scale(.92); }
  #locBtn.loading { color: var(--muted); }
  #locBtn svg { width: 22px; height: 22px; }
  body.vmode #locBtn { display: none; }
  .maplibregl-popup-content { font-family: var(--round); font-weight: 800; font-size: 12.5px; padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow); }
  .maplibregl-popup-tip { display: none; }

  /* ミニプレーヤー（地図モード） */
  #mini { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); width: min(480px, 92vw); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-l); overflow: hidden; display: none; z-index: 200; }
  #mini.show { display: block; }
  #miniHead { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; }
  #miniHead:active { cursor: grabbing; }
  #miniHead h2 { margin: 0; flex: 1; font-family: var(--round); font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rbtn { width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: color .18s, border-color .18s; }
  .rbtn:hover { color: var(--green-deep); border-color: var(--green); }
  .mini-vid { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  #miniFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #miniDesc { margin: 0; padding: 10px 16px; font-size: 12.5px; color: #4a544f; line-height: 1.6; max-height: 5em; overflow-y: auto; }
  #miniDesc:empty { display: none; }
  .mini-foot { display: flex; gap: 8px; padding: 0 14px 14px; }
  .chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .chip.primary { background: var(--green); border-color: var(--green); color: #fff; }

  /* ===== 動画モード（YouTubeコントロールは表示。UIは中段に配置して衝突回避） ===== */
  #videoMode { position: fixed; inset: 0; z-index: 250; background: #000; display: none; justify-content: center; }
  #videoMode.show { display: flex; }
  #feed { position: relative; width: 100%; max-width: 480px; height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #feed::-webkit-scrollbar { display: none; }
  .slot { position: relative; width: 100%; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; background: #000; overflow: hidden; }

  /* 動画：画面いっぱい（上下左右のYouTube UIはそのまま使える） */
  .vid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .vid iframe { border: 0; }
  .slot.shorts .vid iframe { width: 100%; height: 100%; }
  .slot.wide .vid iframe { width: 100%; height: auto; aspect-ratio: 16/9; }

  /* サムネ＋再生ボタン（未再生時） */
  .poster { position: absolute; inset: 0; z-index: 20; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .poster::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .poster .play { position: relative; z-index: 1; width: 66px; height: 66px; border-radius: 50%; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; color: #fff; }
  .poster .play .ic { width: 28px; height: 28px; margin-left: 3px; }
  .slot.playing .poster { display: none; }

  /* 左下：タイトル・概要 */
  .info { position: absolute; left: 12px; right: 84px; bottom: calc(120px + env(safe-area-inset-bottom)); z-index: 14; pointer-events: none; }
  .info > * { pointer-events: auto; }
  .info-card { color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.9); }
  .info-card .count { font-size: 11px; color: #7ee8b3; font-weight: 700; letter-spacing: .04em; }
  .info-card h1 { margin: 3px 0 4px; font-family: var(--round); font-weight: 800; font-size: 16px; line-height: 1.4; }
  .info-card p { margin: 0; font-size: 12.5px; line-height: 1.5; color: #eef2f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .info-card p.open { -webkit-line-clamp: unset; }
  .info-card p:empty { display: none; }

  /* 右下：地図・共有・▲▼（YouTubeショートの右下風・縦アイコン列） */
  .rail { position: absolute; right: 10px; bottom: calc(120px + env(safe-area-inset-bottom)); z-index: 16; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .rail button { background: transparent; border: none; padding: 0; width: 54px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; }
  .rail .circle { width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; transition: background .18s, transform .15s; }
  .rail button:active .circle { transform: scale(.9); }
  .rail button:hover .circle { background: rgba(0,0,0,.7); }
  .rail button.map .circle { background: var(--green); border-color: var(--green); }
  .rail button.map:hover .circle { background: var(--green-deep); }
  .rail button.jump .circle { background: #e8894a; border-color: #e8894a; }
  .rail button.jump:hover .circle { background: #d4762f; }
  .rail .circle .ic { width: 21px; height: 21px; }
  .rail small { font-size: 10px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .rail .navpair { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .rail .navpair .circle { width: 42px; height: 42px; }

  /* 左右の端：縦スワイプで切り替え（動画中央のシーク操作は邪魔しない） */
  .strip { position: absolute; top: 0; bottom: 0; width: 34px; z-index: 12; touch-action: pan-y; }
  .strip.l { left: 0; } .strip.r { right: 0; }

  /* 上部の小さなブランド表示（YouTubeの帯と被らないよう左上に小さく） */
  .tag { position: absolute; left: 12px; top: calc(10px + env(safe-area-inset-top)); z-index: 13; font-family: var(--round); font-weight: 800; font-size: 13px; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.9); pointer-events: none; opacity: .9; }
  .tag em { font-style: normal; color: #35d68a; }

  /* モード切り替え：常に中央下に固定 */
  #modeToggle { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 320; }
  #modeToggle button { padding: 11px 26px; font-size: 13.5px; }
  #modeToggle button.active { background: var(--green); color: #fff; }
  /* 動画モードでは黒背景に。位置は中央下のまま、YouTubeの赤いバーより手前・少し上に */
  body.vmode #modeToggle { bottom: calc(64px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.14); }
  body.vmode #modeToggle button { color: #cfd6d2; }
  body.vmode #modeToggle button.active { background: var(--green); color: #fff; }

  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(12px); background: #fff; color: var(--ink); padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 600; box-shadow: var(--shadow-l); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== カスタムピン（要素自体にtransformを掛けない＝地図追従がズレない） ===== */
  .pin { cursor: pointer; }
  .pin img { width: 34px; height: auto; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.4)); transition: transform .15s; transform-origin: bottom center; }
  .pin:hover img { transform: scale(1.12); }

  /* ===== 矢印（ピン↔ミニプレーヤー） ===== */
  #connector { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; display: none; }
  #connector.show { display: block; }
  #connectorLine { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }

  /* ===== 動画モード：⋯メニュー ===== */
  .kebab { position: absolute; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 18; }
  .kebab .kbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .kebab .kbtn .ic { width: 22px; height: 22px; }
  .kebab-menu { position: absolute; right: 0; top: 48px; background: #fff; color: var(--ink); border-radius: 12px; box-shadow: var(--shadow-l); overflow: hidden; min-width: 168px; display: none; }
  .kebab-menu.show { display: block; }
  .kebab-menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; padding: 12px 15px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: left; }
  .kebab-menu button:hover { background: var(--green-soft); color: var(--green-deep); }
  .kebab-menu .ic { width: 17px; height: 17px; }

  /* ===== 概要ボトムシート ===== */
  #sheetWrap { position: fixed; inset: 0; z-index: 420; display: none; }
  #sheetWrap.show { display: block; }
  #sheetWrap .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; }
  #sheetWrap.show .backdrop { opacity: 1; }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: #fff; border-radius: 20px 20px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 80dvh; overflow-y: auto; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  #sheetWrap.show #sheet { transform: translateY(0); }
  #sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: #d8dcd6; margin: 4px auto 14px; }
  #sheet .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #sheet .sheet-head .lbl { font-family: var(--round); font-weight: 800; font-size: 20px; }
  #sheet .sheet-head .ttl { flex: 1; text-align: center; font-weight: 700; font-size: 13px; color: var(--muted); margin: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sheetDesc { font-size: 13.5px; line-height: 1.8; color: #3a443f; white-space: pre-wrap; min-height: 40px; }
  #sheetDesc:empty::after { content: "（説明はありません）"; color: var(--muted); }
  #sheetMeta { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: #4a544f; line-height: 1.9; background: #fafaf7; }
  #sheetMeta .row { display: flex; gap: 8px; }
  #sheetMeta .row b { color: var(--muted); font-weight: 700; min-width: 68px; flex: 0 0 auto; }
  #sheetMeta .row span { font-family: ui-monospace, monospace; word-break: break-all; }

  /* ===== 動画/再生履歴タブ ===== */
  .feed-tabs { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 260; display: none; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); }
  body.vmode .feed-tabs { display: flex; }
  .feed-tabs button { flex: 1; border: none; background: transparent; color: #aeb6b1; font-size: 13px; font-weight: 700; padding: calc(10px + env(safe-area-inset-top)) 0 10px; cursor: pointer; position: relative; }
  .feed-tabs button.active { color: #fff; }
  .feed-tabs button.active::after { content: ""; position: absolute; bottom: 0; left: 38%; right: 38%; height: 2.5px; background: var(--green); border-radius: 2px; }

  #historyView { position: absolute; inset: 0; z-index: 255; background: #0b0e10; color: #fff; overflow-y: auto; display: none; padding: calc(58px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom)); }
  #historyView.show { display: block; }
  #historyView h3 { font-family: var(--round); font-weight: 800; font-size: 15px; margin: 8px 2px 12px; display: flex; align-items: center; gap: 6px; }
  #historyView h3 .ic { width: 17px; height: 17px; color: #35d68a; }
  .hgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 26px; }
  .hcard { background: #161b1e; border: 1px solid #232a27; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s, border-color .18s; }
  .hcard:hover { transform: translateY(-2px); border-color: var(--green); }
  .hcard .thumb { width: 100%; aspect-ratio: 16/9; background: #000 center/cover no-repeat; }
  .hcard .cap { padding: 8px 10px; font-size: 11.5px; font-weight: 700; line-height: 1.35; color: #e6ebe8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hempty { color: #6d7a74; font-size: 12.5px; padding: 4px 2px 24px; }

  /* 保存ボタン（レールに追加） */
  .rail button.saved .circle { background: var(--green); border-color: var(--green); }

  @media (max-width: 420px) {
    .info { right: 78px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- ピンとミニプレーヤーを結ぶ矢印 -->
<svg id="connector">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e8a4f"/>
    </marker>
  </defs>
  <line id="connectorLine" x1="0" y1="0" x2="0" y2="0" stroke="#0e8a4f" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7" marker-end="url(#arrowhead)"/>
</svg>

<div id="topBar">
  <div id="brand"><span class="dot"></span>yoh<em>-</em>map</div>
  <div id="topRight">
    <div class="seg">
      <button id="layerMap">地図</button>
      <button id="layerSat" class="active">衛星</button>
    </div>
    <button class="fab" id="btn3D">
      <svg class="ic" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="m3 9v6l9 5 9-5V9"/></svg>3D
    </button>
  </div>
</div>

<div id="status">読み込み中...</div>

<!-- スポット一覧（地図モード） -->
<div id="searchWrap">
  <button id="listBtn">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    スポット一覧
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div id="searchResults"></div>
  <div id="groupBar">
    <div class="group-chip" data-g="campus"><span class="dot"></span>大学周辺</div>
    <div class="group-chip" data-g="member"><span class="dot"></span>メンバーのスポット</div>
  </div>
</div>

<!-- 現在地ボタン -->
<button id="locBtn" aria-label="現在地へ">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<!-- 地図モード：ミニプレーヤー -->
<div id="mini">
  <div id="miniHead">
    <h2 id="miniTitle">動画タイトル</h2>
    <button class="rbtn" id="miniClose"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="mini-vid"><iframe id="miniFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  <p id="miniDesc"></p>
  <div class="mini-foot">
    <button class="chip primary" id="miniToVideo"><svg class="ic" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z"/></svg>動画モードで見る</button>
    <button class="chip" id="miniJump" style="display:none"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12h13M13 6l6 6-6 6"/></svg>次のメンバー</button>
    <button class="chip" id="miniShare"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4m0 0L8 8m4-4 4 4"/></svg>共有</button>
  </div>
</div>

<!-- 動画モード -->
<div id="videoMode">
  <div class="feed-tabs">
    <button id="tabVideo" class="active">動画</button>
    <button id="tabHistory">再生履歴</button>
  </div>
  <div class="kebab">
    <button class="kbtn" id="kebabBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    <div class="kebab-menu" id="kebabMenu">
      <button id="mShare"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4m0 0L8 8m4-4 4 4"/></svg>共有</button>
      <button id="mCopy"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>公式URLコピー</button>
    </div>
  </div>
  <div id="feed"></div>
  <div id="historyView">
    <h3><svg class="ic" viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>再生履歴</h3>
    <div class="hgrid" id="playedGrid"></div>
    <h3><svg class="ic" viewBox="0 0 24 24"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1Z"/></svg>保存履歴</h3>
    <div class="hgrid" id="savedGrid"></div>
  </div>
</div>

<!-- 概要ボトムシート -->
<div id="sheetWrap">
  <div class="backdrop" id="sheetBackdrop"></div>
  <div id="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <span class="lbl">概要</span>
      <span class="ttl" id="sheetTitle">タイトル</span>
      <button class="rbtn" id="sheetClose"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="sheetDesc"></div>
    <div id="sheetMeta"></div>
  </div>
</div>

<!-- モード切り替え -->
<div id="modeToggle" class="seg">
  <button id="btnMapMode" class="active">地図</button>
  <button id="btnVideoMode">動画</button>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const CAMPUS = [139.9554, 35.8332];
  const SHEET_ID = '172EjAWId_IgXCqYVE-1OShEyka6SF7xOSbxCSqWrbqM';
  const GID = 0;
  const FORCED_SHORTS = ['6vzIkPSp_A8'];   // 必ず縦型で表示する動画ID
  const JUMP_IDS = [7, 8, 9, 10];          // メンバー紹介：この順で「次のメンバーへ」巡回（将来ここを編集）

  let videoData = [], bounds = null, current = 0;

  /* ---------- 地図 ---------- */
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: { type: 'raster', tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19, attribution: '© OpenStreetMap contributors' },
        esri: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 19, attribution: 'Tiles © Esri' },
        bld: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } }
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm', layout: { visibility: 'none' } },
        { id: 'esri', type: 'raster', source: 'esri', layout: { visibility: 'visible' } },
        { id: 'bld3d', type: 'fill-extrusion', source: 'bld', layout: { visibility: 'none' },
          paint: { 'fill-extrusion-color': '#f2efe6', 'fill-extrusion-height': ['get', 'height'], 'fill-extrusion-opacity': .92, 'fill-extrusion-vertical-gradient': true } }
      ]
    },
    center: CAMPUS, zoom: 14.5, minZoom: 2, maxZoom: 19, maxPitch: 70
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: [0, -38] });

  /* ---------- スプレッドシート ---------- */
  function colIdx(cols, names) {
    for (let i = 0; i < cols.length; i++) { const l = (cols[i].label || '').toLowerCase().trim(); if (names.includes(l)) return i; }
    for (let i = 0; i < cols.length; i++) { const l = (cols[i].label || '').toLowerCase(); if (names.some(n => l.includes(n))) return i; }
    return -1;
  }
  function ytId(v) {
    const s = String(v).trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : s;
  }

  async function loadSheet() {
    try {
      const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`);
      const txt = await res.text();
      const m = txt.match(/setResponse\(([\s\S]*)\);/);
      const json = JSON.parse(m[1]);
      const cols = json.table.cols, rows = json.table.rows;

      const iLat = colIdx(cols, ['lat', '緯度']);
      const iLng = colIdx(cols, ['lon', 'lng', '経度']);
      const iLatB = colIdx(cols, ['lat-b', 'latb', 'lat_b']);
      const iLngB = colIdx(cols, ['lon-b', 'lonb', 'lon_b', 'lng-b']);
      const iId = colIdx(cols, ['id']);
      const iPlc = colIdx(cols, ['place', '場所', 'スポット']);
      const iYt = colIdx(cols, ['youtubeid', 'youtube', 'videoid']);
      const iTtl = colIdx(cols, ['title', 'タイトル']);
      const iDsc = colIdx(cols, ['description', '概要', '説明']);
      const iTyp = colIdx(cols, ['type', '種類']);

      videoData = rows.map((r, n) => {
        const c = r.c || [];
        const val = i => (i >= 0 && c[i] && c[i].v != null) ? String(c[i].v) : '';
        const lat = parseFloat(val(iLat)), lng = parseFloat(val(iLng));
        const latB = parseFloat(val(iLatB)), lngB = parseFloat(val(iLngB));
        const rowId = parseInt(val(iId), 10);
        const id = val(iYt) ? ytId(val(iYt)) : null;
        const place = val(iPlc);
        const title = val(iTtl) || id || `スポット ${n + 1}`;
        const desc = val(iDsc);
        const type = val(iTyp).toLowerCase();
        const shorts = FORCED_SHORTS.includes(id) || type.includes('short') || type.includes('縦')
          || /short|ショート|縦/i.test(`${title} ${desc}`);
        // メンバーのスポット（JUMP_IDS）だけ「次のメンバーへ」ボタンを出す
        const hasJump = JUMP_IDS.includes(rowId);
        return { title, place, lat, lng, latB, lngB, rowId, id, desc, shorts, hasJump };
      }).filter(d => !isNaN(d.lat) && !isNaN(d.lng) && d.id);

      setStatus(`${videoData.length} 件のスポット`);
    } catch (e) {
      console.error(e);
      setStatus('シートを読めませんでした。デモを表示します');
      videoData = [
        { title: 'さつき (デモ)', lat: 35.83364, lng: 139.95635, id: 'JjwVpOU_bFo', desc: 'デモ用の動画です。', shorts: false },
        { title: 'ひいらぎ (デモ)', lat: 35.83430, lng: 139.95535, id: 'dQw4w9WgXcQ', desc: '', shorts: true }
      ];
    }

    videoData.forEach(addPin);
    buildFeed();

    // 起動時は「南柏駅〜麗澤大学」が両方見える範囲を表示。
    // 上のバー（一覧ボタン等）に南柏が隠れないよう上側の余白を大きめに取る。
    const MINAMIKASHIWA = [139.9494, 35.8478];   // 南柏駅（おおよそ）
    const startBounds = new maplibregl.LngLatBounds();
    startBounds.extend(MINAMIKASHIWA);
    startBounds.extend(CAMPUS);
    map.fitBounds(startBounds, {
      padding: { top: 150, bottom: 90, left: 50, right: 50 },
      duration: 1400, essential: true, maxZoom: 16
    });
    setTimeout(() => $('status').classList.add('fade'), 3000);
  }

  /* ---------- 保存・履歴（localStorageが使えれば永続化、ダメならメモリ） ---------- */
  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return this._m?.[k] ?? def; } },
    set(k, val) { try { localStorage.setItem(k, JSON.stringify(val)); } catch (e) { (this._m = this._m || {})[k] = val; } },
    _m: {}
  };
  let played = store.get('yoh_played', []);   // 再生履歴（youtubeIDの配列・新しい順）
  let saved = store.get('yoh_saved', []);     // 保存履歴（youtubeIDの配列・新しい順）

  function pushPlayed(id) {
    played = played.filter(x => x !== id); played.unshift(id);
    if (played.length > 40) played.pop();
    store.set('yoh_played', played);
  }
  function toggleSaved(id) {
    if (saved.includes(id)) saved = saved.filter(x => x !== id);
    else saved.unshift(id);
    if (saved.length > 60) saved.pop();
    store.set('yoh_saved', saved);
    return saved.includes(id);
  }

  function addPin(d, i) {
    const el = document.createElement('div');
    el.className = 'pin';
    const img = document.createElement('img');
    img.src = PIN_IMG; img.alt = d.title; img.draggable = false;
    el.appendChild(img);
    const mk = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([d.lng, d.lat]).addTo(map);
    d.marker = mk;
    d.group = (d.rowId >= 1 && d.rowId <= 6) ? 'campus' : 'member';
    el.dataset.group = d.group;
    el.addEventListener('mouseenter', () => popup.setLngLat([d.lng, d.lat]).setHTML(d.title).addTo(map));
    el.addEventListener('mouseleave', () => popup.remove());
    el.addEventListener('click', e => { e.stopPropagation(); openMini(i); });
  }

  /* ---------- 地図/衛星・3D ---------- */
  function base(k) {
    map.setLayoutProperty('osm', 'visibility', k === 'osm' ? 'visible' : 'none');
    map.setLayoutProperty('esri', 'visibility', k === 'sat' ? 'visible' : 'none');
    $('layerMap').classList.toggle('active', k === 'osm');
    $('layerSat').classList.toggle('active', k === 'sat');
  }
  $('layerMap').onclick = () => base('osm');
  $('layerSat').onclick = () => base('sat');

  let is3D = false, bldLoaded = false;
  $('btn3D').onclick = async () => {
    is3D = !is3D;
    $('btn3D').classList.toggle('active', is3D);
    if (is3D) {
      if (!bldLoaded) await loadBuildings();
      map.setLayoutProperty('bld3d', 'visibility', 'visible');
      map.easeTo({ pitch: 62, bearing: -18, zoom: Math.max(map.getZoom(), 16.8), duration: 900 });
    } else {
      map.setLayoutProperty('bld3d', 'visibility', 'none');
      map.easeTo({ pitch: 0, bearing: 0, duration: 700 });
    }
  };

  async function loadBuildings() {
    const [lng, lat] = CAMPUS, d = 0.008;
    const q = `[out:json][timeout:25];(way["building"](${lat-d},${lng-d},${lat+d},${lng+d}););out geom;`;
    setStatus('建物データを取得中...'); $('status').classList.remove('fade');
    try {
      const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: q });
      const json = await res.json();
      const features = (json.elements || []).map(el => {
        if (!el.geometry || el.geometry.length < 4) return null;
        const ring = el.geometry.map(p => [p.lon, p.lat]);
        if (String(ring[0]) !== String(ring[ring.length - 1])) ring.push(ring[0]);
        const t = el.tags || {};
        let h = parseFloat(t.height);
        if (isNaN(h)) { const lv = parseFloat(t['building:levels']); h = isNaN(lv) ? 8 : lv * 3.2; }
        return { type: 'Feature', properties: { height: h }, geometry: { type: 'Polygon', coordinates: [ring] } };
      }).filter(Boolean);
      map.getSource('bld').setData({ type: 'FeatureCollection', features });
      bldLoaded = true;
      setStatus(`建物 ${features.length} 棟を表示`);
    } catch (e) { setStatus('建物データを取得できませんでした'); }
    setTimeout(() => $('status').classList.add('fade'), 2500);
  }

  /* ---------- 埋め込みURL（YouTubeのコントロールは表示する） ---------- */
  const embed = id => `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;

  /* ---------- スポット一覧（ボタンで開閉・選ぶと飛ぶ） ---------- */
  const listBtn = $('listBtn'), searchResults = $('searchResults');

  function buildList() {
    const campus = [], member = [];
    videoData.forEach((d, i) => (d.group === 'campus' ? campus : member).push({ d, i }));
    const row = ({ d, i }) => `
      <div class="sr-item" data-i="${i}">
        <div class="sr-thumb" style="background-image:url('https://img.youtube.com/vi/${d.id}/default.jpg')"></div>
        <div class="sr-text">
          <div class="sr-title">${d.title}</div>
          <div class="sr-place">${d.place || ''}</div>
        </div>
        <button class="sr-go" data-i="${i}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13M13 6l6 6-6 6"/></svg>飛ぶ</button>
      </div>`;
    let html = '<div class="sr-scroll">';
    if (campus.length) html += '<div class="sr-group-label">大学周辺</div>' + campus.map(row).join('');
    if (member.length) html += '<div class="sr-group-label">メンバーのスポット</div>' + member.map(row).join('');
    html += '</div>';
    searchResults.innerHTML = html;
    // 行全体・飛ぶボタンどちらでも飛ぶ
    searchResults.querySelectorAll('.sr-item').forEach(el => {
      el.onclick = () => goToSpot(+el.dataset.i);
    });
    searchResults.querySelectorAll('.sr-go').forEach(b => {
      b.onclick = e => { e.stopPropagation(); goToSpot(+b.dataset.i); };
    });
  }

  function openList() { buildList(); searchResults.classList.add('show'); listBtn.classList.add('open'); }
  function closeList() { searchResults.classList.remove('show'); listBtn.classList.remove('open'); }

  function goToSpot(i) {
    const d = videoData[i];
    closeList();
    map.flyTo({ center: [d.lng, d.lat], zoom: 18, duration: 1200, essential: true });
    setTimeout(() => openMini(i), 1100);
  }

  listBtn.onclick = e => {
    e.stopPropagation();
    searchResults.classList.contains('show') ? closeList() : openList();
  };
  // 一覧の外をタップしたら閉じる
  document.addEventListener('click', e => {
    if (!e.target.closest('#searchWrap')) closeList();
  });

  /* ---------- グループ表示切替（大学周辺 / メンバーのスポット） ---------- */
  const groupOn = { campus: true, member: true };
  function applyGroups() {
    videoData.forEach(d => {
      const el = d.marker && d.marker.getElement();
      if (el) el.style.display = groupOn[d.group] ? '' : 'none';
    });
  }
  document.querySelectorAll('.group-chip').forEach(chip => {
    chip.onclick = () => {
      const g = chip.dataset.g;
      groupOn[g] = !groupOn[g];
      chip.classList.toggle('off', !groupOn[g]);
      applyGroups();
    };
  });

  /* ---------- 現在地へ ---------- */
  let locMarker = null;
  $('locBtn').onclick = () => {
    const btn = $('locBtn');
    if (!navigator.geolocation) { alert('この端末では現在地を取得できません。'); return; }
    btn.classList.add('loading');
    navigator.geolocation.getCurrentPosition(
      pos => {
        btn.classList.remove('loading');
        const { longitude: lng, latitude: lat } = pos.coords;
        if (locMarker) locMarker.remove();
        const el = document.createElement('div');
        el.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4);';
        locMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
        map.flyTo({ center: [lng, lat], zoom: 16, duration: 1400, essential: true });
      },
      err => {
        btn.classList.remove('loading');
        alert('現在地を取得できませんでした。位置情報の許可を確認してください。');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };


  let activeMini = -1;
  function openMini(i) {
    current = i; activeMini = i;
    const d = videoData[i];
    $('miniTitle').textContent = d.title;
    $('miniDesc').textContent = d.desc || '';
    $('miniFrame').src = embed(d.id);
    $('miniJump').style.display = d.hasJump ? '' : 'none';
    mini.classList.add('show');
    // ドラッグ位置をリセット（右中央に戻す）
    Object.assign(mini.style, { left: '', top: '', right: '20px', transform: 'translateY(-50%)' });
    // ピンにズームイン。ピンは画面左寄りに置いて、右のミニプレーヤーとの間に矢印を通す
    const off = Math.min(150, innerWidth * 0.22);
    map.flyTo({ center: [d.lng, d.lat], zoom: Math.max(map.getZoom(), 17), offset: [-off, 0], duration: 900, essential: true });
    pushPlayed(d.id); refreshHistory();
    $('connector').classList.add('show');
    requestAnimationFrame(updateConnector);
  }
  function closeMini() {
    mini.classList.remove('show'); $('miniFrame').src = '';
    activeMini = -1; $('connector').classList.remove('show');
  }
  $('miniClose').onclick = closeMini;
  $('miniToVideo').onclick = () => { closeMini(); setMode('video'); };
  $('miniShare').onclick = () => share(current);
  $('miniJump').onclick = () => jumpToNextMember(current);

  // 次のメンバーのスポットへ飛ぶ（7→8→9→10→7 の順にループ）
  function jumpToNextMember(i) {
    const d = videoData[i];
    if (!d || !d.hasJump) return;
    // JUMP_IDS の並び順で「今の次」を探す（末尾なら先頭に戻る）
    const pos = JUMP_IDS.indexOf(d.rowId);
    if (pos < 0) return;
    const nextRowId = JUMP_IDS[(pos + 1) % JUMP_IDS.length];
    const ni = videoData.findIndex(v => v.rowId === nextRowId);
    if (ni < 0) return;
    const nd = videoData[ni];
    closeMini();
    if ($('videoMode').classList.contains('show')) setMode('map');
    map.flyTo({ center: [nd.lng, nd.lat], zoom: 17, duration: 1400, essential: true });
    setTimeout(() => openMini(ni), 1300);
    toast(`次のメンバー：${nd.title}`);
  }

  // 矢印の更新（ピン先端 → ミニプレーヤーの最も近い辺）
  function updateConnector() {
    if (activeMini < 0 || !mini.classList.contains('show')) return;
    const d = videoData[activeMini];
    const p = map.project([d.lng, d.lat]);   // ピン先端の画面座標
    const r = mini.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // ミニプレーヤーの最も近い辺の中点を終点にする
    let x2 = p.x < r.left ? r.left : (p.x > r.right ? r.right : cx);
    let y2 = p.y < r.top ? r.top : (p.y > r.bottom ? r.bottom : cy);
    // 辺の中央に寄せる
    if (x2 === cx) y2 = (p.y < cy ? r.top : r.bottom);
    else y2 = Math.max(r.top + 10, Math.min(r.bottom - 10, p.y));
    const line = $('connectorLine');
    line.setAttribute('x1', p.x); line.setAttribute('y1', p.y - 18);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  }
  map.on('move', updateConnector);
  addEventListener('resize', updateConnector);

  let drag = null;
  $('miniHead').addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = mini.getBoundingClientRect();
    Object.assign(mini.style, { left: r.left + 'px', top: r.top + 'px', right: 'auto', transform: 'none' });
    drag = { x: e.clientX, y: e.clientY, l: r.left, t: r.top };
    $('miniHead').setPointerCapture(e.pointerId);
  });
  $('miniHead').addEventListener('pointermove', e => {
    if (!drag) return;
    mini.style.left = Math.max(8 - mini.offsetWidth * .6, Math.min(innerWidth - mini.offsetWidth * .4, drag.l + e.clientX - drag.x)) + 'px';
    mini.style.top = Math.max(8, Math.min(innerHeight - 60, drag.t + e.clientY - drag.y)) + 'px';
    updateConnector();
  });
  $('miniHead').addEventListener('pointerup', () => drag = null);

  /* ---------- モード切り替え ---------- */
  function setMode(mode) {
    const v = mode === 'video';
    if (v && !videoData.length) return;
    $('btnVideoMode').classList.toggle('active', v);
    $('btnMapMode').classList.toggle('active', !v);
    $('videoMode').classList.toggle('show', v);
    $('topBar').style.display = v ? 'none' : 'flex';
    $('status').style.display = v ? 'none' : 'block';
    document.body.classList.toggle('vmode', v);
    if (v) { closeMini(); $('tabVideo').classList.add('active'); $('tabHistory').classList.remove('active'); $('historyView').classList.remove('show'); requestAnimationFrame(() => { goSlot(current, false); play(current); }); }
    else { stopAll(); }
  }
  $('btnMapMode').onclick = () => setMode('map');
  $('btnVideoMode').onclick = () => setMode('video');

  /* ---------- 動画フィード ---------- */
  const feed = $('feed');

  function buildFeed() {
    feed.innerHTML = videoData.map((d, i) => `
      <section class="slot ${d.shorts ? 'shorts' : 'wide'}" data-i="${i}">
        <div class="vid"></div>

        <div class="poster" style="background-image:url('https://img.youtube.com/vi/${d.id}/hqdefault.jpg')">
          <span class="play"><svg class="ic" viewBox="0 0 24 24"><path d="m8 6 10 6-10 6V6Z"/></svg></span>
        </div>

        <div class="strip l"></div>
        <div class="strip r"></div>

        <span class="tag">yoh<em>-</em>map</span>

        <div class="info">
          <div class="info-card">
            <div class="count">${i + 1} / ${videoData.length}</div>
            <h1>${d.title}</h1>
            <p>${d.desc || ''}</p>
          </div>
        </div>

        <div class="rail">
          <button class="map" data-a="map"><span class="circle"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10Z"/><circle cx="12" cy="11" r="2.2"/></svg></span><small>地図</small></button>
          ${d.hasJump ? `<button class="jump" data-a="jump"><span class="circle"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12h13M13 6l6 6-6 6"/></svg></span><small>次へ</small></button>` : ''}
          <button data-a="save"><span class="circle"><svg class="ic" viewBox="0 0 24 24"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1Z"/></svg></span><small>保存</small></button>
          <button data-a="share"><span class="circle"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4m0 0L8 8m4-4 4 4"/></svg></span><small>共有</small></button>
          <div class="navpair">
            <button data-a="prev"><span class="circle"><svg class="ic" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></svg></span></button>
            <button data-a="next"><span class="circle"><svg class="ic" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></span></button>
          </div>
        </div>
      </section>
    `).join('');

    feed.querySelectorAll('.slot').forEach(s => {
      const i = +s.dataset.i;
      s.querySelector('.poster').onclick = () => play(i);
      // タイトル/概要タップで概要ボトムシート
      s.querySelector('.info-card').onclick = () => openSheet(i);
      // 保存ボタンの初期状態を反映
      const saveBtn = s.querySelector('[data-a="save"]');
      if (saved.includes(videoData[i].id)) saveBtn.classList.add('saved');
      s.querySelectorAll('[data-a]').forEach(b => b.onclick = e => {
        e.stopPropagation();
        const a = b.dataset.a, d = videoData[i];
        if (a === 'map') { setMode('map'); map.flyTo({ center: [d.lng, d.lat], zoom: 18, duration: 1200 }); setTimeout(() => openMini(i), 1200); }
        else if (a === 'jump') jumpToNextMember(i);
        else if (a === 'share') share(i);
        else if (a === 'save') { const on = toggleSaved(d.id); b.classList.toggle('saved', on); toast(on ? '保存しました' : '保存を解除しました'); refreshHistory(); }
        else if (a === 'next') goSlot(Math.min(i + 1, videoData.length - 1));
        else if (a === 'prev') goSlot(Math.max(i - 1, 0));
      });
    });

    // 画面中央に来たコマを自動再生
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting && en.intersectionRatio > .6) {
        const i = +en.target.dataset.i;
        current = i;
        if ($('videoMode').classList.contains('show')) play(i);
      }
    }), { root: feed, threshold: [.6] });
    feed.querySelectorAll('.slot').forEach(s => io.observe(s));
  }

  function play(i) {
    const slot = feed.querySelector(`.slot[data-i="${i}"]`);
    if (!slot) return;
    feed.querySelectorAll('.slot').forEach(s => {
      if (+s.dataset.i !== i) { s.classList.remove('playing'); s.querySelector('.vid iframe')?.remove(); }
    });
    const box = slot.querySelector('.vid');
    if (!box.querySelector('iframe')) {
      const f = document.createElement('iframe');
      f.src = embed(videoData[i].id);
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
      f.setAttribute('allowfullscreen', '');
      box.appendChild(f);
    }
    slot.classList.add('playing');
    current = i;
    pushPlayed(videoData[i].id); refreshHistory();
  }
  function stopAll() {
    feed.querySelectorAll('.slot').forEach(s => { s.classList.remove('playing'); s.querySelector('.vid iframe')?.remove(); });
  }
  function goSlot(i, smooth = true) {
    feed.querySelector(`.slot[data-i="${i}"]`)?.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto' });
  }

  addEventListener('keydown', e => {
    if (!$('videoMode').classList.contains('show')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); goSlot(Math.min(current + 1, videoData.length - 1)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); goSlot(Math.max(current - 1, 0)); }
    if (e.key === 'Escape') setMode('map');
  });

  /* ---------- 概要ボトムシート ---------- */
  function openSheet(i) {
    const d = videoData[i];
    $('sheetTitle').textContent = d.title;
    $('sheetDesc').textContent = d.desc || '';
    $('sheetMeta').innerHTML = `
      <div class="row"><b>場所</b><span>${d.title}</span></div>
      <div class="row"><b>座標</b><span>${d.lat}, ${d.lng}</span></div>
      <div class="row"><b>YouTube ID</b><span>${d.id}</span></div>`;
    $('sheetWrap').classList.add('show');
  }
  function closeSheet() { $('sheetWrap').classList.remove('show'); }
  $('sheetClose').onclick = closeSheet;
  $('sheetBackdrop').onclick = closeSheet;

  /* ---------- ⋯メニュー ---------- */
  const kebabMenu = $('kebabMenu');
  $('kebabBtn').onclick = e => { e.stopPropagation(); kebabMenu.classList.toggle('show'); };
  document.addEventListener('click', () => kebabMenu.classList.remove('show'));
  $('mShare').onclick = () => { kebabMenu.classList.remove('show'); share(current); };
  $('mCopy').onclick = () => {
    kebabMenu.classList.remove('show');
    const url = `https://www.youtube.com/watch?v=${videoData[current].id}`;
    navigator.clipboard?.writeText(url).then(() => toast('公式URLをコピーしました')).catch(() => toast(url));
  };

  /* ---------- 動画/再生履歴タブ ---------- */
  $('tabVideo').onclick = () => switchTab('video');
  $('tabHistory').onclick = () => switchTab('history');
  function switchTab(t) {
    const hist = t === 'history';
    $('tabVideo').classList.toggle('active', !hist);
    $('tabHistory').classList.toggle('active', hist);
    $('historyView').classList.toggle('show', hist);
    if (hist) { stopAll(); refreshHistory(); }
    else { play(current); }
  }

  function refreshHistory() {
    const byId = id => videoData.find(v => v.id === id);
    const cardHTML = id => {
      const d = byId(id);
      const title = d ? d.title : id;
      return `<div class="hcard" data-id="${id}">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${id}/hqdefault.jpg')"></div>
        <div class="cap">${title}</div></div>`;
    };
    const pg = $('playedGrid'), sg = $('savedGrid');
    if (!pg || !sg) return;
    pg.innerHTML = played.length ? played.map(cardHTML).join('') : '<div class="hempty">まだ再生した動画はありません</div>';
    sg.innerHTML = saved.length ? saved.map(cardHTML).join('') : '<div class="hempty">まだ保存した動画はありません</div>';
    // 空メッセージのときはグリッドの列組みを解除
    pg.style.display = played.length ? 'grid' : 'block';
    sg.style.display = saved.length ? 'grid' : 'block';
    // カードタップで、その動画にジャンプして再生
    document.querySelectorAll('.hcard').forEach(c => c.onclick = () => {
      const idx = videoData.findIndex(v => v.id === c.dataset.id);
      if (idx < 0) return;
      switchTab('video');
      requestAnimationFrame(() => { goSlot(idx, false); play(idx); });
    });
  }

  /* ---------- 共通 ---------- */
  function share(i) {
    const d = videoData[i], url = `https://www.youtube.com/watch?v=${d.id}`;
    if (navigator.share) navigator.share({ title: d.title, url }).catch(() => {});
    else navigator.clipboard?.writeText(url).then(() => toast('リンクをコピーしました'));
  }
  function setStatus(m) { $('status').textContent = m; }
  let tt;
  function toast(m) {
    const t = $('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000);
  }

  map.on('load', loadSheet);
</script>
</body>
</html>
